name: Build & Publish Docker Image (GHCR)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily check at 02:13 UTC; only rebuilds when base image or Debian packages changed
    - cron: "13 2 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      base_digest: ${{ steps.decide.outputs.base_digest }}
    steps:
      - name: Checkout Dockerfile
        uses: actions/checkout@v4
        with:
          sparse-checkout: Dockerfile

      - name: Log in to GitHub Container Registry (ghcr.io)
        if: github.event_name == 'schedule'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for base image or OS package updates
        id: decide
        run: |
          set -euo pipefail
          BASE_IMAGE=$(awk '/^FROM / {img=$2} END {print img}' Dockerfile)
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):latest"

          docker buildx imagetools inspect --raw "$BASE_IMAGE" > /tmp/base-manifest.raw
          BASE_DIGEST="sha256:$(sha256sum /tmp/base-manifest.raw | awk '{print $1}')"
          echo "base_digest=$BASE_DIGEST" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Event '${{ github.event_name }}': running build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! docker pull -q "$IMAGE"; then
            echo "No published image found yet: running build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SAVED_DIGEST=$(docker inspect --format '{{ index .Config.Labels "io.tm904.base-digest" }}' "$IMAGE" 2>/dev/null || true)
          if [ "$SAVED_DIGEST" != "$BASE_DIGEST" ]; then
            echo "Base image '$BASE_IMAGE' changed ($SAVED_DIGEST -> $BASE_DIGEST): rebuilding."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          docker run --rm --user root --entrypoint sh "$IMAGE" -c 'apt-get update -qq && apt-get -s upgrade' > /tmp/apt-sim.txt
          if grep -q '^Inst ' /tmp/apt-sim.txt; then
            echo "Pending Debian package updates detected:"
            grep '^Inst ' /tmp/apt-sim.txt
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Base image and OS packages are up to date; skipping rebuild."
          echo "should_build=false" >> "$GITHUB_OUTPUT"

  test:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run unit tests
        run: npm test

      - name: Run linter
        run: npm run lint

  docker:
    needs: [check, test]
    if: needs.check.outputs.should_build == 'true' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (ghcr.io)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short

      - name: Build and smoke-test image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: controversial-cards:test
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=multiarch
          cache-to: type=gha,mode=max,scope=amd64

      - name: Smoke-test container
        run: |
          docker run -d --name cc-test -p 127.0.0.1:3000:3000 controversial-cards:test
          trap 'docker logs cc-test || true; docker rm -f cc-test || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/health | grep -q '"ok":true'
          curl -fsS http://127.0.0.1:3000/ >/dev/null

      - name: Build and push multi-arch Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            io.tm904.base-digest=${{ needs.check.outputs.base_digest }}
          cache-from: |
            type=gha,scope=multiarch
            type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=multiarch
