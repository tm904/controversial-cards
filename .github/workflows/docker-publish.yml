name: Build & Publish Docker Image (GHCR)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily rebuild at 02:13 UTC to pick up Debian/Node security patches
    - cron: "13 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run unit tests
        run: npm test

      - name: Run linter
        run: npm run lint

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (ghcr.io)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short

      - name: Build and smoke-test image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: controversial-cards:test
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=multiarch
          cache-to: type=gha,mode=max,scope=amd64

      - name: Smoke-test container
        run: |
          docker run -d --name cc-test -p 127.0.0.1:3000:3000 controversial-cards:test
          trap 'docker logs cc-test || true; docker rm -f cc-test || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/health | grep -q '"ok":true'
          curl -fsS http://127.0.0.1:3000/ >/dev/null

      - name: Build and push multi-arch Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=multiarch
            type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=multiarch
